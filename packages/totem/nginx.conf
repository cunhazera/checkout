server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Device identity. Provisioning replaces this file per totem, so it must
    # never be cached — a stale copy would point the screen at another store.
    location = /totem.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # The API is same-origin from the browser's point of view, which keeps the
    # totem free of CORS and the API free of cross-origin exposure.
    location /api/ {
        proxy_pass http://api:3210/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # A payment resolves inside the request: 15s at the gateway plus a 30s
        # reconciliation window. Anything shorter cuts a customer off mid-payment.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The bundle is content-hashed; index.html and the identity file are not.
    location ~* \.(js|css|woff2?|png|jpe?g|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
