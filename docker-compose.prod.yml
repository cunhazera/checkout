# The whole system in containers: database, API, totem, and the mock gateway.
#
#   docker compose -f docker-compose.prod.yml up --build -d
#   docker compose -f docker-compose.prod.yml exec api node packages/api/dist/db/migrate.js
#   docker compose -f docker-compose.prod.yml exec api node packages/api/dist/db/seed.js
#
# Note that this defines a `db` service in the same project as docker-compose.yml,
# so starting this stack takes that container over and the development setup
# loses its 5433 binding until you bring this one down.
#
# Not a production deployment: there is no TLS, no secret management and no
# backups. It is the missing step between "the tests pass" and "it runs
# somewhere", and the shape a real deployment would take.

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: checkout
      POSTGRES_PASSWORD: checkout
      POSTGRES_DB: checkout
    volumes:
      - prod_pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U checkout -d checkout']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    environment:
      DATABASE_URL: postgres://checkout:checkout@db:5432/checkout
      PAYMENT_DRIVER: http
      PAYMENT_GATEWAY_URL: http://gateway:3220
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3210/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Longer than the payment window (15s call + 30s reconciliation), so a
    # restart never cuts a customer off mid-payment.
    stop_grace_period: 60s

  gateway:
    build:
      context: .
      dockerfile: packages/gateway/Dockerfile
    environment:
      GATEWAY_HOST: 0.0.0.0

  totem:
    build:
      context: .
      dockerfile: packages/totem/Dockerfile
    ports:
      - '8080:80'
    depends_on:
      - api

volumes:
  prod_pgdata:
